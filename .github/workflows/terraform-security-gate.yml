# .github/workflows/terraform-security-gate.yml
name: Terraform Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # Stage 1: Format + Validation (fastest checks first)
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'

      - name: Format Check
        run: terraform -chdir=terraform/ fmt -check -diff

      - name: Validate Config
        run: |
          terraform -chdir=terraform/ init -backend=false
          terraform -chdir=terraform/ validate

  # Stage 2: tfsec - Fast source-level security scan
  tfsec-scan:
    runs-on: ubuntu-latest
    needs: terraform-validate
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false            # Hard-block on any finding
          format: sarif
          output_file: tfsec-results.sarif
          include_terraform_modules: true
          minimum_severity: high       # Only HIGH in CI; MEDIUM for local dev

      - name: Upload SARIF to GitHub
        if: always() && hashFiles('tfsec-results.sarif')
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
  checkov-source-scan:
    runs-on: ubuntu-latest
    needs: terraform-validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'

      - name: Install Checkov
        run: pip3 install checkov==3.2.*

      - name: Init modules for accurate scanning
        run: terraform -chdir=terraform/ init -backend=false

      - name: Run Checkov on source (diff-scan against branch)
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --compact \
            --download-external-modules true \
            --branch ${{ github.head_ref || 'main' }} \
            --output sarif \
            --output-file ./checkov-source.sarif

      - name: Upload SARIF to GitHub
        if: ${{ always() && hashFiles('checkov-source.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-source.sarif

  # Stage 4: Checkov + Conftest on PLAN output (most accurate)
  plan-level-security:
    runs-on: ubuntu-latest
    needs: terraform-validate
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_BUCKET_NAME: ${{ secrets.TF_BUCKET_NAME }}
      TF_BUCKET_NAME_2: ${{ secrets.TF_BUCKET_NAME_2 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.x'

      - name: Install Checkov and Conftest
        run: |
          pip3 install checkov==3.2.*
          curl -sSfL https://raw.githubusercontent.com/open-policy-agent/conftest/master/scripts/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Terraform Init
        run: terraform -chdir=terraform/ init -backend=false

      - name: Terraform Plan
        run: terraform -chdir=terraform/ plan -out=tfplan

      - name: Checkov Plan Scan (most accurate)
        run: |
          checkov -f tfplan.json \
            --framework terraform_plan \
            --compact \
            --output cli,sarif \
            --output-file stdout,checkov-plan.sarif

      - name: Upload Checkov Plan SARIF
        if: ${{ always() && hashFiles('checkov-plan.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-plan.sarif

      - name: OPA/Conftest Custom Policy Check
        run: |
          conftest test tfplan.json \
            --policy policies/ \
            --all-namespaces

  # Stage 5: PR comment with summary
  pr-comment:
    runs-on: ubuntu-latest
    needs: [tfsec-scan, checkov-source-scan, plan-level-security]
    if: always() && github.event_name == 'pull_request'
    steps:
